[project]
name = "rag-first-project"
version = "0.1.0"
description = "RAG agent for PDF question answering"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "llama-index-core>=0.14.21",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-llms-openai>=0.7.7",
    "llama-index-readers-file>=0.6.0",
    "llama-index-vector-stores-chroma>=0.5.5",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
